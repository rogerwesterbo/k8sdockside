<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Virtual machine</title>
        <link rel="stylesheet" href="vm.css" />
        <!-- The bridge to the app. Served by k8sdockside itself, always at this path. -->
        <script src="/plugin-ui/_sdk/k8sdockside.js"></script>
    </head>
    <body>
        <header>
            <div class="ident">
                <span id="status" class="pill">…</span>
                <span id="since" class="faint"></span>
            </div>
            <!-- The VM's own button group, drawn from what the plugin offers on
                 this machine right now. Every press is confirmed by the app. -->
            <div id="buttons" class="buttons" role="toolbar" aria-label="Machine actions"></div>
        </header>

        <p id="error" class="error" hidden></p>

        <dl id="facts" class="facts"></dl>

        <section id="conditions-block" hidden>
            <h2>Conditions</h2>
            <div id="conditions" class="chips"></div>
        </section>

        <section id="migrations-block" hidden>
            <h2>Recent migrations</h2>
            <table>
                <thead>
                    <tr><th>Name</th><th>Phase</th><th>From</th><th>To</th></tr>
                </thead>
                <tbody id="migrations"></tbody>
            </table>
        </section>

        <!-- A classic script, not type="module": a sandboxed frame has an opaque
             origin, so a module would be a cross-origin load. -->
        <script src="vm.js"></script>
    </body>
</html>
